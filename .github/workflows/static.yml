name: Deploy Organization Page

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Clone organization page
      - uses: actions/checkout@v4
        with:
          repository: loci-memory/loci-memory.github.io
          token: ${{ secrets.GH_PAGES_TOKEN }}
          path: pages

      - run: |
          rm -rf pages/*
          rsync -av \
            --exclude .git \
            --exclude .github \
            ./ pages/

      - run: |
          cd pages
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Deploy website" || exit 0
          git push
